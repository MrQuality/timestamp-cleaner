name: TUF feasibility spike
on:
  pull_request:
    paths: ['spikes/tuf-updates/**', '.github/workflows/tuf-spike.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tuf-spike-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verifier:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path spikes/tuf-updates/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path spikes/tuf-updates/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path spikes/tuf-updates/Cargo.toml -- --nocapture
      - run: cargo build --locked --release --manifest-path spikes/tuf-updates/Cargo.toml
