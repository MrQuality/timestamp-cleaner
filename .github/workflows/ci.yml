name: Rust quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
          # Supervise the media process itself, not Chocolatey's launcher shim.
          $mediaToolsRoot = Join-Path $env:ChocolateyInstall 'lib/ffmpeg/tools'
          $ffmpegPrograms = @(Get-ChildItem -LiteralPath $mediaToolsRoot -Recurse -File -Filter ffmpeg.exe)
          if ($ffmpegPrograms.Count -ne 1) { throw 'Expected exactly one installed FFmpeg executable' }
          $ffmpegProgram = $ffmpegPrograms[0].FullName
          $ffprobeProgram = Join-Path $ffmpegPrograms[0].DirectoryName 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $ffprobeProgram -PathType Leaf)) { throw 'FFprobe executable is missing' }
          "TIMESTAMP_CLEANER_FFMPEG=$ffmpegProgram" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TIMESTAMP_CLEANER_FFPROBE=$ffprobeProgram" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Direct media tools: $ffmpegProgram and $ffprobeProgram"
      - run: cargo fmt --all -- --check
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release
      - name: Package Windows portable preview
        if: runner.os == 'Windows'
        run: python scripts/package_windows.py --binary target/release/timestamp-cleaner.exe
      - name: Build and test Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis.install --version=3.12.0 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Pinned NSIS installation failed' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read package version' }
          $version = ($metadata.packages | Where-Object name -eq 'timestamp-cleaner').version
          python scripts/package_installer.py "dist/timestamp-cleaner-$version-windows-x64.zip" --compiler $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed' }
          ./scripts/test_installer.ps1 -Installer "dist/timestamp-cleaner-$version-windows-x64-setup.exe" -Version $version
      - name: Upload Windows portable preview
        # Both formats contain the same verified application payload.
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-portable-${{ github.run_attempt }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0 # The distributable ZIP is already compressed.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
  minimum-rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.92.0
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo check --locked --all-targets --all-features
  license-and-source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked --all-features check licenses sources
      - run: python3 scripts/dependency_licenses.py --check
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the pinned Gitleaks scanner
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan all reachable history without printing secrets
        run: '"${{ runner.temp }}/gitleaks-bin/gitleaks" git --redact --no-banner --log-opts="--all --full-history" .'
