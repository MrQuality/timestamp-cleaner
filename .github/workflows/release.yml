name: Windows portable release
on:
  workflow_dispatch:
  push:
    tags: ['v*-beta.*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: python3 scripts/release_policy.py
  quality:
    needs: validate
    uses: ./.github/workflows/ci.yml
  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Locate the successful Windows package in this run
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A partial retry may reuse quality jobs from an earlier attempt.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --paginate --jq '.artifacts[] | select(.name | startswith("windows-portable-")) | select(.expired == false) | .id' > artifact-ids.txt
          artifact_id=$(sort -n artifact-ids.txt | tail -n 1)
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || { echo 'Windows package artifact is missing'; exit 1; }
          echo "id=$artifact_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.package.outputs.id }}
          path: dist
      - name: Verify downloaded ZIP checksum
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Prepare draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Windows x64 portable beta candidate. This draft is not ready for publication.

          Download the ZIP and SHA256SUMS.txt together, verify the checksum and extract
          the entire ZIP. START-HERE.md contains setup and recovery instructions.
          FFmpeg/FFprobe are external and may be installed with consent through WinGet.
          The Microsoft Visual C++ v14 Redistributable (x64) is also required;
          see START-HERE.md for Microsoft's official runtime setup instructions.

          The executable is unsigned. The repair uses FFmpeg rectangle interpolation;
          this is not the original Python Telea/Navier-Stokes implementation.

          Clean-machine Windows installation and dependency recovery are unverified.
          The owner deferred those scenarios to beta testing; production readiness
          still requires them.

          Before publishing: review the included third-party notices, inspect executable
          branding/runtime requirements, complete Windows MKV/MP4 smoke tests on this
          exact artifact, and replace these candidate notes with
          dated results and known limitations. See docs/releases.md in the source repo.
          EOF
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --draft --prerelease --title "Timestamp Cleaner $RELEASE_TAG" \
            --notes-file release-notes.md
