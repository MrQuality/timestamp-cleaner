name: Project website
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/icon-256.png', 'scripts/*build_site.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'assets/icon-256.png', 'scripts/*build_site.py', '.github/workflows/pages.yml']
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release events can point at an older tag; deploy reviewed site source.
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
      - run: python3 -m unittest discover -s scripts -p 'test_build_site.py' -v
      - name: Resolve published releases and build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api 'repos/{owner}/{repo}/releases?per_page=100' --paginate --slurp | jq 'add' > "$RUNNER_TEMP/releases.json"
          python3 scripts/build_site.py "$RUNNER_TEMP/releases.json"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
