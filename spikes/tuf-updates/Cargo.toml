[package]
name = "timestamp-cleaner-tuf-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "Apache-2.0"

# Isolate the experiment from the application's graph and lockfile.
[workspace]

[dependencies]
tough = { version = "=0.24.0", features = ["http"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
serde_json = "1"
url = "2"
futures = "0.3"

[dev-dependencies]
aws-lc-rs = "1"
jiff = "0.2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
